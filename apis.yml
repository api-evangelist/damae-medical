name: Damae Medical
description: 'Damae Medical is a Paris-based medical device company developing non-invasive
  imaging technology for dermatology and skin cancer diagnostics. Its flagship deepLive
  system is built on proprietary LC-OCT (Line-field Confocal Optical Coherence Tomography),
  which pairs deep tissue penetration with cellular resolution to produce histology-like
  vertical and confocal-like horizontal 3D views of the skin in vivo. deepLive received
  CE Mark Class IIa certification in 2023 and FDA 510(k) clearance in March 2025, and
  integrates quantitative analysis tools such as 3D surface segmentation, cellular
  network visualization, melanin distribution mapping, and dermal fiber segmentation.
  The company was surfaced as a portfolio company of Partech and added to the API
  Evangelist network. It publishes no public developer API, OpenAPI, SDK, or developer
  portal at this time; this profile captures its public identity and domain-security
  posture.'
